<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PATH OF TALENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ffdde1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-in;
        }
        
        .login-container, .id-card {
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            background: white;
        }
        
        .login-container:hover, .id-card:hover {
            transform: translateY(-5px);
        }
        
        .gradient-header {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            padding: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            font-size: 18px;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #ff5f6d, #ff7eb3);
        }
        
        .stats-badge {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
        }
        
        .student-img {
            width: 120px;
            height: 120px;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

        <div class="gradient-header">Student Portal</div>
        <img src="TEAM PNG 2.png" alt="Logo" width="100" class="my-3">
        <input type="text" id="username" class="form-control form-control-lg mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control form-control-lg mb-3" placeholder="Password">
        <button class="btn btn-primary w-100 py-2 fw-bold" onclick="login()">Sign In →</button>
    </div>
    
    <div id="student-info" class="container id-card p-4 text-center d-none">
        <div class="gradient-header">STUDENT IDENTITY</div>
        <img id="student-img" class="student-img rounded-circle mt-3" alt="Student Image">
        <h4 id="student-name" class="fw-bold mt-3"></h4>
        <div class="text-muted">Student ID: <span id="student-id" class="fw-bold"></span></div>
        <div class="d-flex justify-content-center gap-3 mt-3">
            <div class="stats-badge">★ Bonus: <span id="student-bonus"></span></div>
            <div class="stats-badge">▼ Minus: <span id="student-minus"></span></div>
        </div>
        <div class="text-center pt-3">
            <img src="TEAM 2.png" alt="Logo" width="100">
            <div class="text-muted small mt-2">Secure Student Verification System</div>
        </div>
    </div>

        function login() {
            const username = document.getElementById("username").value.toLowerCase().trim();
            const password = document.getElementById("password").value.trim();
            const loginContainer = document.querySelector(".login-container");
            const studentInfo = document.getElementById("student-info");

            document.getElementById("username").classList.remove("is-invalid");
            document.getElementById("password").classList.remove("is-invalid");

            if (students[username] && students[username].id === password) {
                loginContainer.classList.add("d-none");
                studentInfo.classList.remove("d-none");
                document.getElementById("student-name").textContent = students[username].name;
                document.getElementById("student-id").textContent = students[username].id;
                document.getElementById("student-bonus").textContent = students[username].bonus;
                document.getElementById("student-minus").textContent = students[username].minus;
                document.getElementById("student-img").src = students[username].img;
            } else {
                document.getElementById("username").classList.add("is-invalid");
                document.getElementById("password").classList.add("is-invalid");
                alert("Invalid Username or Password!");
            }
        }
